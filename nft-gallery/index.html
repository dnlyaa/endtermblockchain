<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NFT Certificate Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>NFT Certificate Gallery</h1>
    <div>
        <label for="wallet">Your Wallet Address:</label>
        <input type="text" id="wallet" placeholder="0x...">
        <button id="loadNFTs">Load My NFTs</button>
    </div>
    <div>
        <label for="searchName">Search by Name or Program:</label>
        <input type="text" id="searchName" placeholder="Type name or program">
        <label for="filterGrade">Filter by Grade:</label>
        <select id="filterGrade">
            <option value="">All</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
        </select>
    </div>
    <div id="gallery"></div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5/dist/ethers.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
