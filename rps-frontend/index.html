<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock-Paper-Scissors Game</h1>

    <div>
        <button id="connectWallet">Connect Wallet</button>
        <input type="text" id="wallet" placeholder="0x..." readonly>
    </div>

    <div class="choices">
        <button data-choice="0">🪨 Rock</button>
        <button data-choice="1">📄 Paper</button>
        <button data-choice="2">✂️ Scissors</button>
    </div>

    <h2>Game History</h2>
    <div id="history"></div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5/dist/ethers.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
